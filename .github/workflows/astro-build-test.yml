name: Build and regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs install
      - run: bun install --frozen-lockfile
      - name: All retained regression tests (HF, auth, scheduling, APIs and notifications)
        run: bun test --timeout 30000 --coverage
      - name: Check migration journal
        run: bun run db:check
      - name: Validate fresh database and migration upgrade paths
        run: bun run test:migrations
      - name: Build production app
        run: bun run build
