name: Container E2E
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_hf:
        description: Also test a public model on huggingface.co (requires external availability)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: container-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      E2E_LIVE_HF: ${{ github.event_name == 'workflow_dispatch' && inputs.live_hf && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: docker/setup-buildx-action@v3
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: hf-mirror:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy and exercise production containers
        run: bun run test:e2e --skip-build
      - name: Upload results, container logs and browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-e2e-results
          path: tests/e2e/test-results/container/
          retention-days: 14
